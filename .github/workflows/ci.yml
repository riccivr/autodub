name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install (offline tests only; skip ASR/TTS wheels)
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e . --no-deps
          pip install deep-translator edge-tts tqdm
      - name: Offline tests
        run: pytest -m "not network" --ignore=tests/test_components.py --ignore=tests/test_e2e.py -q
